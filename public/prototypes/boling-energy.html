<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>波铃能量计 · 原型 v2</title>
<style>
  :root{
    --gold:#f5cc6f; --ink:#3b2360; --energy:#8fe9ff; --energy-soft:rgba(143,233,255,.85);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    display:grid; place-items:center; overflow:hidden;
    background:#2a1140 url('/assets/park/background.webp') center/cover no-repeat;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#fff8ec; touch-action:manipulation;
  }
  .stage{
    position:relative; width:min(430px,100vw); height:min(100dvh,920px);
    display:flex; flex-direction:column; overflow:hidden;
    background:radial-gradient(120% 55% at 50% 0%, rgba(255,255,255,.16), transparent 62%);
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px; }
  .level-chip{
    display:flex; flex-direction:column; gap:1px; padding:6px 14px 7px;
    border-radius:14px; border:2px solid var(--gold);
    background:linear-gradient(160deg,#7b57b8,#57358a);
    box-shadow:0 4px 0 rgba(72,37,120,.55), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .level-chip b{ font-size:15px; letter-spacing:.5px; }
  .level-chip span{ font-size:10px; opacity:.82; }
  .anim-switch{ display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  .anim-switch input{ position:absolute; opacity:0; pointer-events:none; }
  .switch-track{
    width:44px; height:24px; border-radius:99px; position:relative;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); transition:background .2s;
  }
  .switch-knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff5dc; box-shadow:0 2px 4px rgba(30,10,60,.35); transition:transform .2s;
  }
  .anim-switch input:checked + .switch-track{ background:linear-gradient(160deg,#ffd98b,#e8a44b); border-color:#ffe3a6; }
  .anim-switch input:checked + .switch-track .switch-knob{ transform:translateX(20px); }
  .switch-label{ font-size:11px; font-weight:700; opacity:.9; }
  .hud{ display:flex; align-items:center; gap:6px; padding:2px 16px 6px; font-size:11px; }
  .hud-item{
    display:flex; align-items:center; gap:4px; padding:4px 9px; border-radius:99px;
    background:rgba(48,22,82,.5); border:1px solid rgba(255,255,255,.18);
  }
  .hud-item b{ color:var(--gold); font-size:12px; }
  .hud-tip{ margin-left:auto; opacity:.78; font-size:10px; text-align:right; }
  .board-wrap{
    position:relative; margin:2px 12px 0; padding:10px; border-radius:28px;
    background:linear-gradient(165deg, rgba(255,255,255,.26), rgba(120,74,182,.22));
    border:1.5px solid rgba(255,255,255,.42);
    box-shadow:0 10px 26px rgba(28,10,56,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition:box-shadow .4s;
  }
  .stage.is-win .board-wrap{ box-shadow:0 10px 34px rgba(150,240,255,.35), inset 0 1px 0 rgba(255,255,255,.6); }
  .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; aspect-ratio:1/1; }
  .tile{
    position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
    background:
      radial-gradient(140% 120% at 28% 16%, rgba(255,255,255,.22), transparent 46%),
      linear-gradient(160deg,#6c4a9f,#472a72);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.28), inset 0 -6px 10px rgba(34,12,66,.55), 0 3px 6px rgba(24,8,48,.28);
    transition:transform .12s, box-shadow .25s;
  }
  .tile.is-empty{ cursor:default; }
  .tile:not(.is-empty):active{ transform:scale(.955); }
  .tile::after{
    content:''; position:absolute; inset:0; border-radius:16px; pointer-events:none;
    border:1.5px solid transparent; transition:border-color .2s, box-shadow .25s;
  }
  .tile.is-powered::after{ border-color:rgba(178,238,255,.55); box-shadow:inset 0 0 14px rgba(150,226,255,.45); }
  .tile.is-bad::after{ border-color:rgba(255,140,150,.85); box-shadow:inset 0 0 12px rgba(255,120,140,.45); }
  .tile.is-hint::after{ border-color:var(--gold); box-shadow:inset 0 0 16px rgba(255,214,120,.65); animation:hintPulse 1s ease-in-out infinite; }
  .tile.is-lit-seq::after{ border-color:#ffe9a8; box-shadow:inset 0 0 22px rgba(255,226,150,.85); }
  .pipe{
    position:absolute; width:100%; height:100%; object-fit:contain; pointer-events:none;
    transition:transform .3s cubic-bezier(.34,1.35,.64,1), filter .25s; transform-origin:50% 50%;
  }
  .tile.is-powered .pipe{ filter:drop-shadow(0 0 7px rgba(160,236,255,.85)); }
  .tile .exhibit{ width:92%; height:92%; left:4%; top:4%; object-fit:contain; transition:transform .3s, filter .35s, opacity .35s; }
  .tile .exhibit.is-dormant{ filter:grayscale(.92) brightness(.72); opacity:.82; }
  .tile.is-lit .exhibit{ filter:drop-shadow(0 0 10px rgba(255,226,150,.95)); }
  .tile.is-lit-seq .exhibit{ animation:facilityPop .5s cubic-bezier(.34,1.5,.64,1); }
  .win-banner{
    position:absolute; left:50%; top:50%; z-index:9; width:76%; padding:10px 12px 12px;
    transform:translate(-50%,-50%) scale(.86); opacity:0; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    border-radius:20px; border:2.5px solid var(--gold);
    background:linear-gradient(165deg,#fff7e4,#ffe4b0);
    box-shadow:0 10px 30px rgba(60,20,30,.45), inset 0 2px 0 #fff;
    transition:opacity .3s, transform .38s cubic-bezier(.34,1.56,.64,1);
  }
  .win-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .win-banner b{ color:#b4423d; font-size:22px; letter-spacing:2px; text-shadow:0 1px 0 #fff; }
  .win-banner span{ color:#8a5a2a; font-size:11px; font-weight:700; }
  .fx{ position:absolute; inset:0; z-index:8; pointer-events:none; overflow:hidden; }
  .fx-star{ position:absolute; width:20px; height:20px; object-fit:contain; will-change:transform,left,top; }
  .fx-gain{ position:absolute; font-size:13px; font-weight:900; color:#c8f6ff; text-shadow:0 0 8px rgba(143,233,255,.9); pointer-events:none; white-space:nowrap; }
  .fx-gain.is-loss{ color:#ffc0c6; text-shadow:0 0 8px rgba(255,120,140,.8); }

  /* ---------- 波铃 + 能量计 ---------- */
  .power{ position:relative; flex:1; display:flex; align-items:center; gap:2px; padding:0 14px 10px; z-index:10; transform:translateY(10px); }
  .boling{ position:relative; flex:0 0 124px; display:flex; align-items:center; justify-content:center; }
  .boling-figure{ position:relative; width:124px; height:150px; animation:floaty 2.9s ease-in-out infinite; }
  .boling-body{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center bottom;
    transform:scale(var(--boling-scale,1)); transform-origin:50% 88%;
    filter:drop-shadow(0 7px 9px rgba(30,10,60,.35)) drop-shadow(0 0 var(--boling-glow,4px) rgba(143,233,255,.8));
    transition:transform .45s cubic-bezier(.34,1.3,.64,1), filter .45s;
  }
  .orbit{ position:absolute; width:16px; height:16px; opacity:var(--orbit-op,0); transition:opacity .5s; }
  .orbit img{ width:100%; height:100%; object-fit:contain; filter:hue-rotate(150deg) saturate(1.6) brightness(1.25); }
  .orbit-a{ top:12px; left:6px; animation:orbitA 5.2s linear infinite; }
  .orbit-b{ top:34px; right:2px; animation:orbitB 6.4s linear infinite reverse; }
  .bubble{
    position:absolute; bottom:calc(100% - 6px); left:62%; z-index:30; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:1px; min-width:70px; padding:5px 9px 6px;
    border-radius:14px; border:2px solid #f3d79a;
    background:linear-gradient(175deg,#fffdf4,#fff0cf);
    box-shadow:0 6px 14px rgba(40,16,60,.35);
    transform:translate(-50%,8px) scale(.8); opacity:0;
    transition:opacity .2s, transform .26s cubic-bezier(.34,1.56,.64,1);
  }
  .bubble.show{ opacity:1; transform:translate(-50%,0) scale(1); }
  .bubble img{ height:42px; width:auto; max-width:72px; object-fit:contain; display:block; }
  .bubble span{ font-size:10px; font-weight:800; color:#8a4a63; white-space:nowrap; line-height:1.1; }
  .bubble i{ position:absolute; bottom:-7px; left:50%; margin-left:-6px; width:0; height:0;
    border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #fff0cf; }
  .boling.is-hop .boling-figure{ animation:hop .45s cubic-bezier(.3,1.5,.5,1); }
  .boling.is-shake .boling-figure{ animation:shake .45s ease-out; }
  .boling.is-spin .boling-figure{ animation:spin .8s cubic-bezier(.3,1.2,.4,1); }

  .meter{ flex:1; min-width:0; transform:translateY(-4px); }
  .meter-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px; }
  .meter-head span{ font-size:11px; font-weight:800; letter-spacing:2px; color:#fff3d8; opacity:.9; }
  .meter-head b{ font-size:19px; color:#c8f6ff; text-shadow:0 0 10px rgba(143,233,255,.85); font-variant-numeric:tabular-nums; }
  .meter-head b.is-bump{ animation:bump .32s cubic-bezier(.34,1.56,.64,1); }
  .meter-track{
    position:relative; height:22px; border-radius:99px;
    background:rgba(38,16,70,.72); border:1.5px solid rgba(255,255,255,.32);
    box-shadow:inset 0 3px 8px rgba(18,5,40,.65), 0 2px 0 rgba(255,255,255,.12);
  }
  .meter-fill{
    position:absolute; left:0; top:0; bottom:0; width:calc(var(--p,0) * 1%);
    border-radius:99px;
    background:linear-gradient(90deg,rgba(91,205,255,.95),rgba(143,233,255,.95) 55%,#d8fff0);
    box-shadow:0 0 12px rgba(120,225,255,.85), inset 0 2px 0 rgba(255,255,255,.65);
    transition:width .5s cubic-bezier(.22,1,.36,1);
  }
  .meter-fill::after{
    content:''; position:absolute; right:0; top:50%; width:22px; height:22px; transform:translate(50%,-50%);
    border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.95), rgba(143,233,255,.5) 45%, transparent 72%);
    opacity:var(--head-op,0); transition:opacity .3s;
  }
  .meter-track.is-full{ animation:fullFlash .6s ease-out; }
  .meter-node{ position:absolute; top:50%; width:22px; height:22px; transform:translate(-50%,-50%); z-index:2; }
  .meter-node[data-at="33"]{ left:33%; }
  .meter-node[data-at="66"]{ left:66%; }
  .meter-node[data-at="100"]{ left:100%; }
  .meter-node img{ width:100%; height:100%; object-fit:contain; filter:grayscale(1) brightness(.72); opacity:.4; transition:filter .3s, opacity .3s; }
  .meter-node.is-lit img{ filter:drop-shadow(0 0 7px rgba(255,226,150,.95)); opacity:1; }
  .meter-node.is-pop{ animation:nodePop .5s cubic-bezier(.34,1.56,.64,1); }
  .meter-note{ margin:7px 0 0; font-size:10px; opacity:.7; text-align:right; }

  .controls{ display:flex; gap:10px; padding:8px 16px 18px; }
  .btn{
    flex:1; height:44px; border-radius:16px; border:2px solid rgba(255,255,255,.55);
    font-family:inherit; font-size:14px; font-weight:800; color:#5a2f2a; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(170deg,#ffeec4,#ffd27f);
    box-shadow:0 4px 0 #c98f2e, inset 0 1px 0 #fff;
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #c98f2e, inset 0 1px 0 #fff; }
  .btn.ghost{ flex:0 0 96px; color:#fff4dd; background:rgba(255,255,255,.12); box-shadow:none; border-color:rgba(255,255,255,.4); }
  .btn img{ width:18px; height:18px; object-fit:contain; }

  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-7px) rotate(-2deg); } }
  @keyframes hop{ 0%{ transform:translateY(0);} 40%{ transform:translateY(-14px) scale(1.04,.97);} 70%{ transform:translateY(2px) scale(.98,1.02);} 100%{ transform:none;} }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-5px) rotate(-3deg);} 60%{ transform:translateX(5px) rotate(3deg);} }
  @keyframes spin{ 0%{ transform:rotate(0) scale(1);} 45%{ transform:rotate(200deg) scale(1.08);} 100%{ transform:rotate(360deg) scale(1);} }
  @keyframes nodePop{ 0%{ transform:translate(-50%,-50%) scale(1);} 45%{ transform:translate(-50%,-50%) scale(1.5);} 100%{ transform:translate(-50%,-50%) scale(1);} }
  @keyframes bump{ 0%{ transform:scale(1);} 45%{ transform:scale(1.25);} 100%{ transform:scale(1);} }
  @keyframes fullFlash{ 0%{ box-shadow:0 0 0 rgba(143,233,255,0);} 40%{ box-shadow:0 0 22px rgba(143,233,255,.95);} 100%{ box-shadow:0 0 0 rgba(143,233,255,0);} }
  @keyframes hintPulse{ 0%,100%{ box-shadow:inset 0 0 10px rgba(255,214,120,.45);} 50%{ box-shadow:inset 0 0 22px rgba(255,226,150,.95);} }
  @keyframes facilityPop{ 0%{transform:scale(1);} 45%{transform:scale(1.16);} 100%{transform:scale(1);} }
  @keyframes orbitA{ 0%{ transform:translate(0,0);} 50%{ transform:translate(48px,26px);} 100%{ transform:translate(0,0);} }
  @keyframes orbitB{ 0%{ transform:translate(0,0);} 50%{ transform:translate(-40px,34px);} 100%{ transform:translate(0,0);} }

  .stage.no-anim *, .stage.no-anim *::before, .stage.no-anim *::after{
    animation:none !important; transition:none !important;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="topbar">
    <div class="level-chip"><b>第 1 关</b><span>迎宾门 · 接通</span></div>
    <label class="anim-switch" for="animToggle">
      <input type="checkbox" id="animToggle" checked />
      <span class="switch-track"><span class="switch-knob"></span></span>
      <span class="switch-label">角色动效</span>
    </label>
  </header>

  <div class="hud">
    <div class="hud-item">目标 <b><i id="goalCount">0</i>/1</b></div>
    <div class="hud-item">步数 <b id="stepCount">0</b></div>
    <div class="hud-tip" id="hudTip">每转一下消耗 1 步</div>
  </div>

  <main class="board-wrap">
    <div class="board" id="board" aria-label="能量管道棋盘"></div>
    <div class="win-banner" id="winBanner"><b>设施复苏！</b><span>迎宾门 · 已点亮</span></div>
  </main>

  <section class="power" aria-label="波铃与能量">
    <div class="boling" id="boling">
      <div class="bubble" aria-hidden="true"><img alt="" /><span></span><i></i></div>
      <div class="boling-figure">
        <img class="boling-body" id="bolingBody" src="/assets/park/spirit.webp" alt="波铃" draggable="false" />
        <div class="orbit orbit-a"><img src="/assets/park/icon-star.webp" alt="" /></div>
        <div class="orbit orbit-b"><img src="/assets/park/icon-star.webp" alt="" /></div>
      </div>
    </div>
    <div class="meter" id="meter">
      <div class="meter-head"><span>能量</span><b id="pctText">0%</b></div>
      <div class="meter-track" id="track">
        <div class="meter-fill" id="fill"></div>
        <div class="meter-node" data-at="33"><img src="/assets/park/icon-star.webp" alt="" /></div>
        <div class="meter-node" data-at="66"><img src="/assets/park/icon-star.webp" alt="" /></div>
        <div class="meter-node" data-at="100"><img src="/assets/park/icon-star.webp" alt="" /></div>
      </div>
      <p class="meter-note" id="meterNote">接通管道，能量会流进波铃</p>
    </div>
  </section>

  <footer class="controls">
    <button class="btn ghost" id="resetBtn">重来</button>
    <button class="btn" id="hintBtn"><img src="/assets/park/icon-star.webp" alt="" />波铃，帮我看看</button>
  </footer>
  <div class="fx" id="fx"></div>
</div>

<script>
(function(){
  'use strict';
  var ART = '/assets/park/';
  var EXPR = '/prototypes/expr/';

  var U = 1, R = 2, D = 4, L = 8;
  var DIRS = [[U,-1,0],[R,0,1],[D,1,0],[L,0,-1]];
  var BASE = { line:10, corner:6, battery:R, bulb:U };
  var SOLUTION = { '0,1':0, '0,2':1, '1,2':1, '2,2':3, '2,3':1 };
  var INITIAL = [
    { r:0, c:0, type:'battery', rot:0 },
    { r:0, c:1, type:'line',    rot:3 },
    { r:0, c:2, type:'corner',  rot:0 },
    { r:1, c:2, type:'line',    rot:0 },
    { r:2, c:2, type:'corner',  rot:2 },
    { r:2, c:3, type:'corner',  rot:0 },
    { r:3, c:3, type:'bulb',    rot:0 }
  ];
  var PATH = ['0,1','0,2','1,2','2,2','2,3','3,3'];
  var WORDS = {
    ok: ['能量 +1！', '流过来了！', '接上啦！'],
    bad: ['漏气啦！', '能量跑掉了', '这边断了']
  };

  var stage = document.getElementById('stage');
  var board = document.getElementById('board');
  var fx = document.getElementById('fx');
  var banner = document.getElementById('winBanner');
  var goalEl = document.getElementById('goalCount');
  var stepEl = document.getElementById('stepCount');
  var hudTip = document.getElementById('hudTip');
  var animToggle = document.getElementById('animToggle');
  var resetBtn = document.getElementById('resetBtn');
  var hintBtn = document.getElementById('hintBtn');
  var boling = document.getElementById('boling');
  var track = document.getElementById('track');
  var pctText = document.getElementById('pctText');
  var meterNote = document.getElementById('meterNote');
  var nodes = Array.prototype.slice.call(document.querySelectorAll('.meter-node'));

  var tiles = [];
  var els = {};
  var steps = 0;
  var locked = false;
  var won = false;
  var animOn = true;
  var winSeq = 0;
  var actx = null;
  var litCount = 0;

  function key(r,c){ return r + ',' + c; }
  function rotMask(m, n){
    for (var i=0;i<n;i++){
      m = ((m & L) ? U : 0) | ((m & U) ? R : 0) | ((m & R) ? D : 0) | ((m & D) ? L : 0);
    }
    return m;
  }
  function opposite(d){ return d === U ? D : d === D ? U : d === R ? L : R; }
  function portsOf(t){ return t.type === 'empty' ? 0 : rotMask(BASE[t.type], t.rot || 0); }
  function tileAt(r,c){ for (var i=0;i<tiles.length;i++){ if (tiles[i].r===r && tiles[i].c===c) return tiles[i]; } return null; }
  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function tone(freq, dur, type, vol, delay){
    try{
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.03);
    }catch(e){}
  }
  function sfxRotate(){ tone(360, 0.07, 'triangle', 0.035); }
  function sfxConnect(){ tone(680, 0.1, 'sine', 0.05); tone(920, 0.12, 'sine', 0.045, 0.06); }
  function sfxStar(){ tone(1046, 0.16, 'sine', 0.05); tone(1318, 0.18, 'sine', 0.04, 0.09); }
  function sfxBreak(){ tone(300, 0.12, 'sawtooth', 0.03); tone(200, 0.16, 'sawtooth', 0.03, 0.1); }
  function sfxWin(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f, 0.2, 'sine', 0.05, i*0.1); }); }

  function computePower(){
    var byKey = {};
    tiles.forEach(function(t){ byKey[key(t.r,t.c)] = t; });
    var powered = {}, parent = {}, start = null;
    tiles.forEach(function(t){ if (t.type === 'battery') start = t; });
    if (!start) return { powered:{}, pathKeys:[], size:0 };
    var sk = key(start.r, start.c);
    powered[sk] = true;
    var queue = [start];
    while (queue.length){
      var cur = queue.shift();
      var pm = portsOf(cur);
      for (var i=0;i<DIRS.length;i++){
        var d = DIRS[i][0], dr = DIRS[i][1], dc = DIRS[i][2];
        if (!(pm & d)) continue;
        var nb = byKey[key(cur.r + dr, cur.c + dc)];
        if (!nb || nb.type === 'empty') continue;
        var nm = portsOf(nb);
        if (!(nm & opposite(d))) continue;
        var nk = key(nb.r, nb.c);
        if (!powered[nk]){ powered[nk] = true; parent[nk] = key(cur.r, cur.c); queue.push(nb); }
      }
    }
    var bulb = null;
    tiles.forEach(function(t){ if (t.type === 'bulb') bulb = t; });
    var pathKeys = [], bk = key(bulb.r, bulb.c);
    if (powered[bk]){
      var cur = bk;
      while (cur){ pathKeys.unshift(cur); cur = parent[cur]; }
    }
    return { powered:powered, pathKeys:pathKeys, size:Object.keys(powered).length };
  }

  function energyOf(info){
    var done = 0;
    for (var i=0;i<PATH.length;i++) if (info.powered[PATH[i]]) done++;
    var pct = Math.round(done / PATH.length * 100);
    return { done:done, total:PATH.length, pct:pct };
  }

  function buildBoard(){
    board.innerHTML = '';
    els = {};
    for (var i=0;i<16;i++){
      var r = Math.floor(i/4), c = i % 4;
      var el = document.createElement('div');
      el.className = 'tile';
      el.dataset.r = String(r); el.dataset.c = String(c);
      var t = tileAt(r,c);
      if (!t){ el.classList.add('is-empty'); board.appendChild(el); continue; }
      el.dataset.type = t.type;
      var img = document.createElement('img');
      img.className = 'pipe'; img.alt = ''; img.draggable = false;
      if (t.type === 'battery'){ img.src = ART + 'pipe-source.webp'; }
      else if (t.type === 'bulb'){ img.src = ART + 'exhibit-001.webp'; img.classList.add('exhibit','is-dormant'); }
      else { img.src = ART + 'pipe-' + t.type + '-off.webp'; img.style.transform = 'rotate(' + (t.rot*90) + 'deg)'; }
      el.appendChild(img);
      el.addEventListener('click', (function(tile){
        return function(){ onTileClick(tile, els[key(tile.r, tile.c)]); };
      })(t));
      board.appendChild(el);
      els[key(r,c)] = el;
    }
  }

  function refresh(){
    var info = computePower();
    tiles.forEach(function(t){
      var el = els[key(t.r,t.c)];
      if (!el) return;
      var pw = !!info.powered[key(t.r,t.c)];
      el.classList.toggle('is-powered', pw);
      if (t.type === 'line' || t.type === 'corner'){
        var img = el.querySelector('.pipe');
        img.src = ART + 'pipe-' + t.type + '-' + (pw ? 'on' : 'off') + '.webp';
        img.style.transform = 'rotate(' + (t.rot*90) + 'deg)';
      }
      if (t.type === 'bulb'){
        el.classList.toggle('is-lit', pw);
        el.querySelector('.exhibit').classList.toggle('is-dormant', !pw);
      }
    });
    var full = !!info.powered['3,3'];
    goalEl.textContent = full ? '1' : '0';
    return { info:info, full:full };
  }

  function setEnergy(pct, animate){
    var prev = litCount;
    stage.style.setProperty('--p', pct);
    stage.style.setProperty('--head-op', pct > 1 ? 1 : 0);
    stage.style.setProperty('--boling-scale', (1 + pct / 100 * 0.08).toFixed(3));
    stage.style.setProperty('--boling-glow', (3 + pct / 100 * 7).toFixed(1) + 'px');
    stage.style.setProperty('--orbit-op', pct >= 55 ? 1 : 0);
    pctText.textContent = pct + '%';
    if (animate) {
      pctText.classList.remove('is-bump');
      void pctText.offsetWidth;
      pctText.classList.add('is-bump');
    }
    nodes.forEach(function(node){
      var at = Number(node.dataset.at);
      var lit = pct >= at;
      if (lit && !node.classList.contains('is-lit')){
        node.classList.add('is-lit');
        if (animate){
          node.classList.remove('is-pop');
          void node.offsetWidth;
          node.classList.add('is-pop');
          sfxStar();
          burstAt(node, 7, .7);
          if (at === 100){ track.classList.add('is-full'); setTimeout(function(){ track.classList.remove('is-full'); }, 700); }
        }
      } else if (!lit && node.classList.contains('is-lit')){
        node.classList.remove('is-lit','is-pop');
      }
    });
    litCount = nodes.filter(function(n){ return n.classList.contains('is-lit'); }).length;
    meterNote.textContent = pct >= 100 ? '能量已满！' : '接通管道，能量会流进波铃';
  }

  /* ---------- 粒子 ---------- */
  function centerIn(el){
    var a = el.getBoundingClientRect(), c = fx.getBoundingClientRect();
    return { x:a.left - c.left + a.width/2, y:a.top - c.top + a.height/2 };
  }
  function arcAnim(s, from, to, delay, duration, size){
    s.style.left = from.x + 'px';
    s.style.top = from.y + 'px';
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    fx.appendChild(s);
    var mx = (from.x + to.x) / 2 + (Math.random()*40 - 20);
    var my = Math.min(from.y, to.y) - 40 - Math.random()*30;
    var anim = s.animate([
      { transform:'translate(-50%,-50%) scale(.4)', opacity:0, offset:0 },
      { transform:'translate(-50%,-50%) scale(1)', opacity:1, offset:.18 },
      { transform:'translate(calc(-50% + ' + (mx - from.x) + 'px), calc(-50% + ' + (my - from.y) + 'px)) scale(.95)', opacity:1, offset:.62 },
      { transform:'translate(calc(-50% + ' + (to.x - from.x) + 'px), calc(-50% + ' + (to.y - from.y) + 'px)) scale(.3)', opacity:0, offset:1 }
    ], { duration:duration, delay:delay, easing:'cubic-bezier(.3,.1,.4,1)', fill:'both' });
    anim.onfinish = function(){ s.remove(); };
  }
  function makeSpark(){
    var s = document.createElement('img');
    s.src = ART + 'icon-star.webp';
    s.className = 'fx-star';
    s.style.filter = 'hue-rotate(150deg) saturate(1.6) brightness(1.3)';
    return s;
  }
  function streamToMeter(fromEl, n){
    if (!animOn) return;
    var from = centerIn(fromEl);
    var tr = track.getBoundingClientRect(), fr = fx.getBoundingClientRect();
    var pct = Number(stage.style.getPropertyValue('--p')) || 0;
    var to = { x: tr.left - fr.left + tr.width * (pct / 100), y: tr.top - fr.top + tr.height/2 };
    for (var i=0;i<n;i++) arcAnim(makeSpark(), from, to, i * 55, 560 + Math.random()*120, 9 + Math.random()*5);
  }
  function floatGain(text, loss){
    if (!animOn) return;
    var tr = track.getBoundingClientRect(), fr = fx.getBoundingClientRect();
    var pct = Number(stage.style.getPropertyValue('--p')) || 0;
    var el = document.createElement('div');
    el.className = 'fx-gain' + (loss ? ' is-loss' : '');
    el.textContent = text;
    el.style.left = (tr.left - fr.left + tr.width * (pct / 100)) + 'px';
    el.style.top = (tr.top - fr.top - 6) + 'px';
    fx.appendChild(el);
    var anim = el.animate([
      { transform:'translate(-50%,0) scale(.7)', opacity:0 },
      { transform:'translate(-50%,-14px) scale(1.1)', opacity:1, offset:.25 },
      { transform:'translate(-50%,-34px) scale(1)', opacity:0 }
    ], { duration:720, easing:'cubic-bezier(.2,.8,.3,1)', fill:'both' });
    anim.onfinish = function(){ el.remove(); };
  }
  function leakToMeter(n){
    if (!animOn) return;
    var tr = track.getBoundingClientRect(), fr = fx.getBoundingClientRect();
    var pct = Number(stage.style.getPropertyValue('--p')) || 0;
    var from = { x: tr.left - fr.left + tr.width * (pct / 100), y: tr.top - fr.top + tr.height/2 };
    for (var i=0;i<n;i++){
      var to = { x: from.x + 30 + Math.random()*50, y: from.y + 30 + Math.random()*50 };
      arcAnim(makeSpark(), from, to, i * 40, 520, 8 + Math.random()*4);
    }
  }
  function burstAt(el, n, scale){
    if (!animOn) return;
    var c = centerIn(el);
    for (var i=0;i<n;i++){
      (function(){
        var s = makeSpark();
        s.style.left = c.x + 'px'; s.style.top = c.y + 'px';
        var size = (14 + Math.random()*10) * (scale || 1);
        s.style.width = size + 'px'; s.style.height = size + 'px';
        fx.appendChild(s);
        var ang = Math.random() * Math.PI * 2, dist = 24 + Math.random()*52;
        var anim = s.animate([
          { transform:'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity:0 },
          { transform:'translate(-50%,-50%) scale(1) rotate(50deg)', opacity:1, offset:.22 },
          { transform:'translate(calc(-50% + ' + (Math.cos(ang)*dist).toFixed(1) + 'px), calc(-50% + ' + (Math.sin(ang)*dist).toFixed(1) + 'px)) scale(.15) rotate(150deg)', opacity:0 }
        ], { duration:600 + Math.random()*240, easing:'cubic-bezier(.2,.8,.3,1)', fill:'both' });
        anim.onfinish = function(){ s.remove(); };
      })();
    }
  }

  /* ---------- 波铃动作 ---------- */
  function say(expr, text, ms){
    if (!animOn) return;
    var b = boling.querySelector('.bubble');
    b.querySelector('img').src = EXPR + 'boling_' + expr + '.png';
    b.querySelector('span').textContent = text || '';
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    if (b._timer) clearTimeout(b._timer);
    b._timer = setTimeout(function(){ b.classList.remove('show'); }, ms || 1500);
  }
  function clearBubble(){
    var b = boling.querySelector('.bubble');
    if (b._timer) clearTimeout(b._timer);
    b.classList.remove('show');
  }
  function act(cls, ms){
    if (!animOn) return;
    boling.classList.remove(cls);
    void boling.offsetWidth;
    boling.classList.add(cls);
    setTimeout(function(){ boling.classList.remove(cls); }, ms || 700);
  }

  /* ---------- 交互 ---------- */
  function onTileClick(t, el){
    if (locked) return;
    if (t.type !== 'line' && t.type !== 'corner'){
      if (animOn && !won) say('wink', '这里不用转哦', 1100);
      return;
    }
    var beforeInfo = computePower();
    var beforeE = energyOf(beforeInfo);
    t.rot = (t.rot + 1) % 4;
    steps++;
    stepEl.textContent = String(steps);
    sfxRotate();
    var res = refresh();
    var afterE = energyOf(res.info);
    if (afterE.pct !== beforeE.pct) setEnergy(afterE.pct, animOn);
    if (res.full){ startWin(res.info); return; }
    if (!animOn) return;
    if (afterE.done > beforeE.done){
      streamToMeter(el, 5);
      floatGain('+1 能量', false);
      act('is-hop', 500);
      say('sparkle', pick(WORDS.ok), 1000);
      sfxConnect();
    } else if (afterE.done < beforeE.done){
      leakToMeter(5);
      floatGain('-1 能量', true);
      act('is-shake', 500);
      say('surprised', pick(WORDS.bad), 1200);
      sfxBreak();
      el.classList.add('is-bad');
      setTimeout(function(){ el.classList.remove('is-bad'); }, 460);
    } else {
      act('is-shake', 320);
      if (Math.random() < 0.35) say('wink', '再试试别的方向', 1100);
    }
  }

  function cellEl(r,c){ return els[key(r,c)]; }

  function startWin(info){
    locked = true; won = true;
    var seq = ++winSeq;
    stage.classList.add('is-win');
    hudTip.textContent = '能量充满，设施点亮！';
    clearBubble();
    if (!animOn){ banner.classList.add('show'); return; }
    sfxWin();
    say('sparkle', '能量充满啦！', 1800);
    act('is-hop', 520);
    sleep(480).then(function(){
      if (seq !== winSeq) return null;
      burstAt(cellEl(3,3), 20, 1.15);
      banner.classList.add('show');
      act('is-spin', 820);
      return sleep(760);
    }).then(function(){
      if (seq !== winSeq) return;
      burstAt(cellEl(3,3), 10, .9);
    });
  }

  function findNextFix(){
    var order = ['0,1','0,2','1,2','2,2','2,3'];
    for (var i=0;i<order.length;i++){
      var p = order[i].split(',');
      var t = tileAt(Number(p[0]), Number(p[1]));
      if (t && SOLUTION[order[i]] !== undefined && t.rot !== SOLUTION[order[i]]) return t;
    }
    return null;
  }
  function onHint(){
    if (locked) return;
    var target = findNextFix();
    if (!target){ say('happy', '都接对啦，转一下试试', 1400); return; }
    var el = els[key(target.r, target.c)];
    if (!animOn){
      el.classList.add('is-hint');
      setTimeout(function(){ el.classList.remove('is-hint'); }, 1600);
      return;
    }
    say('sparkle', '从这里开始！', 1700);
    var origin = centerIn(boling.querySelector('.boling-body'));
    var to = centerIn(el);
    for (var i=0;i<3;i++){
      var s = makeSpark();
      arcAnim(s, origin, to, i * 110, 620, 12);
    }
    setTimeout(function(){
      el.classList.add('is-hint');
      burstAt(el, 4, .8);
    }, 360);
    setTimeout(function(){ el.classList.remove('is-hint'); }, 2200);
  }

  function reset(){
    winSeq++;
    locked = false; won = false; steps = 0;
    stepEl.textContent = '0'; goalEl.textContent = '0';
    hudTip.textContent = animOn ? '每转一下消耗 1 步' : '对照模式：角色动效已关闭';
    banner.classList.remove('show');
    stage.classList.remove('is-win');
    fx.innerHTML = '';
    clearBubble();
    boling.classList.remove('is-hop','is-shake','is-spin');
    tiles = INITIAL.map(function(t){ return { r:t.r, c:t.c, type:t.type, rot:t.rot }; });
    buildBoard();
    refresh();
    setEnergy(0, false);
  }

  tiles = INITIAL.map(function(t){ return { r:t.r, c:t.c, type:t.type, rot:t.rot }; });
  buildBoard();
  refresh();
  setEnergy(0, false);

  animToggle.addEventListener('change', function(){
    animOn = animToggle.checked;
    stage.classList.toggle('no-anim', !animOn);
    if (!animOn){
      winSeq++;
      clearBubble();
      boling.classList.remove('is-hop','is-shake','is-spin');
      hudTip.textContent = '对照模式：角色动效已关闭';
      if (won) banner.classList.add('show');
    } else {
      hudTip.textContent = won ? '能量充满，设施点亮！' : '每转一下消耗 1 步';
    }
  });
  resetBtn.addEventListener('click', reset);
  hintBtn.addEventListener('click', onHint);

  setTimeout(function(){
    if (!won) say('happy', '转两下，能量就来了！', 2400);
  }, 700);

  window.__demo = {
    rotate: function(r,c){ var t = tileAt(r,c); if (t) onTileClick(t, els[key(r,c)]); },
    hint: onHint, reset: reset,
    state: function(){ return { steps:steps, won:won, goal:goalEl.textContent, pct:pctText.textContent, animOn:animOn, lit:litCount }; }
  };
})();
</script>
</body>
</html>
